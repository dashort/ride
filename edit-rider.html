function pickFirstValidValue() {

  showMessage('Loading rider details...');
  
  google.script.run
    .withSuccessHandler(function(rider) {
      if (rider) {
        handleRiderResponse({
          success: true,
          rider: rider,
          options: {
            statusOptions: ['Active', 'Inactive', 'Vacation', 'Training', 'Suspended'],
            certificationOptions: ['', 'Not Certified', 'Standard', 'Instructor'],

        showMessage('Rider not found');

    .withFailureHandler(function(error) {
      console.error('Failed to load rider:', error);

    })
    .getRiderForWebApp(riderId);
}

    function handleRiderResponse(response){
      if(!response){
        showMessage('Rider not found');
        return;
      }

      if(typeof response.success === 'boolean'){
        if(!response.success){
          showMessage(response.message || 'Rider not found');

        }

        if(response.options){
          applyFormOptions(response.options);
        }

        if(response.rider){

        } else {
          showMessage('Rider not found');

        return;

      // Legacy response - assume it's a rider object
      populateForm(response);

    function preloadFormOptions(){
      if(typeof google === 'undefined' || !google.script || !google.script.run){
        return;
      }
      google.script.run
        .withSuccessHandler(function(options){ applyFormOptions(options); })
        .withFailureHandler(function(error){ console.error('Failed to load form options', error); })
        .getRiderFormOptions();
    }

    function applyFormOptions(options){
      if(!options) return;
      updateSelectOptions('status', options.statusOptions, false);
      updateSelectOptions('certification', options.certificationOptions, true);
      updateSelectOptions('partTime', options.partTimeOptions, true);
      updateSelectOptions('platoon', options.platoonOptions, true);
    }

    function updateSelectOptions(selectId, options, includeEmpty){
      const select = document.getElementById(selectId);
      if(!select || !Array.isArray(options)) return;

      const currentValue = select.value;
      select.innerHTML = '';

      if(includeEmpty){
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = '';
        select.appendChild(emptyOption);
      }

      options.forEach(function(optionValue){
        const optionEl = document.createElement('option');
        optionEl.value = optionValue;
        optionEl.textContent = optionValue;
        select.appendChild(optionEl);
      });

      if(currentValue){
        select.value = currentValue;
      }
    }

    function populateForm(rider){
      if(!rider){
        showMessage('Rider not found');
        return;
      }
      document.getElementById('riderId').value = rider['Rider ID'] || rider.riderId || rider.jpNumber || '';
      document.getElementById('fullName').value = rider['Full Name'] || rider.name || '';
      document.getElementById('phone').value = rider['Phone Number'] || rider.phone || '';
      document.getElementById('email').value = rider['Email'] || rider.email || '';
      document.getElementById('status').value = rider['Status'] || rider.status || '';
      document.getElementById('certification').value = rider['Certification'] || rider.certification || '';
      document.getElementById('totalAssignments').value = rider['Total Assignments'] || rider.totalAssignments || '';
      document.getElementById('lastAssignmentDate').value = rider['Last Assignment Date'] || rider.lastAssignmentDate || '';
      document.getElementById('partTime').value = rider['Part Time Rider'] || rider['Part-Time Rider'] || rider.partTime || '';
      document.getElementById('payrollNumber').value = rider['Payroll Number'] || rider.payrollNumber || '';
      document.getElementById('platoon').value = rider['Platoon'] || rider.platoon || '';
    }

    function saveRider(){
      const data = {
        'Rider ID': document.getElementById('riderId').value,
        'Full Name': document.getElementById('fullName').value,
        'Phone Number': document.getElementById('phone').value,
        'Email': document.getElementById('email').value,
        'Status': document.getElementById('status').value,
        'Certification': document.getElementById('certification').value,
        'Part-Time Rider': document.getElementById('partTime').value,
        'Payroll Number': document.getElementById('payrollNumber').value,
        'Platoon': document.getElementById('platoon').value
      };
      if(typeof google !== 'undefined' && google.script && google.script.run){
        google.script.run
          .withSuccessHandler(function(res){ showMessage(res.message || 'Saved'); })
          .withFailureHandler(function(){ showMessage('Failed to save rider'); })
          .updateRider(data);
      } else {
        showMessage('Google Apps Script runtime unavailable');
      }
    }

    document.addEventListener('DOMContentLoaded', loadRider);
